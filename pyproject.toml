[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-acl-audit"
version = "0.1.0"
description = "Audit Apache Kafka ACLs from kafka-acls output: wildcards, broad operations, shadowed and duplicate rules"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kafka-acl-audit = "kafka_acl_audit.cli:main"

[project.urls]
Homepage = "https://github.com/narayana006/kafka-acl-audit"

[tool.setuptools]
packages = ["kafka_acl_audit"]
