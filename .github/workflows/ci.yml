name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run on examples
        run: |
          kafka-acl-audit examples/kafka-acls-list.txt --topics examples/topics.txt --fail-on never
          kafka-acl-audit examples/kafka-acls-list-3.7.txt --format json --fail-on never
          kafka-acl-audit examples/acls.json --fail-on high
